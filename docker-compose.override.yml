services:
  web:
    build: .
    environment:
      - DEBUG=1
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    ports:
      - "127.0.0.1:5432:5432"

networks:
  proxy:
    external: false
